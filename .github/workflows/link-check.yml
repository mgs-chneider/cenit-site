name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        working-directory: astro
        run: npm ci

      - name: Build site
        working-directory: astro
        run: npm run build

      - name: Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --no-progress
            --exclude-mail
            --exclude-private
            --exclude 'vbg.de/pmt'
            --exclude 'cenit-ev\.de'
            --root-dir '${{ github.workspace }}/astro/dist'
            --accept 200,204,301,302
            './astro/dist/**/*.html'
          fail: false
